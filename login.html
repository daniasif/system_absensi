<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Absensi Sekolah</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',   
                        primarySoft: '#EFF6FF',
                        primaryDark: '#1D4ED8',
                        success: '#16A34A',
                        warning: '#F59E0B',
                        danger: '#DC2626',
                        bgSoft: '#F8FAFC',
                        borderSoft: '#E2E8F0',
                        textActive: '#0F172A',
                        textMuted: '#64748B',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-bgSoft text-slate-700 antialiased font-sans min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN CONTAINER CARD -->
    <div class="w-full max-w-md bg-white rounded-2xl border border-borderSoft shadow-xl shadow-slate-200/50 p-6 sm:p-8 space-y-6">
        
        <!-- HEADER / LOGO -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary text-white shadow-lg shadow-blue-500/30 mb-2">
                <i class="fas fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-textActive tracking-tight">Masuk ke Akun Anda</h1>
            <p class="text-xs sm:text-sm text-textMuted">Sistem Informasi Absensi Sekolah</p>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            
            <!-- INPUT USERNAME -->
            <div class="space-y-1.5">
                <label for="username" class="block text-xs font-semibold text-textActive">Username / NIP</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-slate-400 text-sm">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" id="username" name="username" required placeholder="Masukkan username atau NIP"
                           class="w-full pl-10 pr-4 py-2.5 bg-bgSoft border border-borderSoft rounded-xl text-xs sm:text-sm text-textActive placeholder-slate-400 focus:outline-none focus:border-primary focus:bg-white transition-all">
                </div>
            </div>

            <!-- INPUT USER ROLE -->
            <div class="space-y-1.5">
                <label for="user_role" class="block text-xs font-semibold text-textActive">Peran (User Role)</label>
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-slate-400 text-sm">
                        <i class="fas fa-user-shield"></i>
                    </span>
                    <select id="user_role" name="user_role" required
                            class="w-full pl-10 pr-10 py-2.5 bg-bgSoft border border-borderSoft rounded-xl text-xs sm:text-sm text-textActive focus:outline-none focus:border-primary focus:bg-white transition-all appearance-none">
                        <option value="" disabled selected>-- Pilih Peran --</option>
                        <option value="admin">Administrator Sekolah</option>
                        <option value="walas">Guru / Wali Kelas</option>
                    </select>
                    <span class="absolute right-3.5 text-slate-400 text-xs pointer-events-none">
                        <i class="fas fa-chevron-down"></i>
                    </span>
                </div>
            </div>

            <!-- INPUT PASSWORD -->
            <div class="space-y-1.5">
                <div class="flex items-center justify-between">
                    <label for="password" class="block text-xs font-semibold text-textActive">Password</label>
                    <a href="#" class="text-[11px] text-primary hover:underline font-medium">Lupa Password?</a>
                </div>
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-slate-400 text-sm">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                           class="w-full pl-10 pr-10 py-2.5 bg-bgSoft border border-borderSoft rounded-xl text-xs sm:text-sm text-textActive placeholder-slate-400 focus:outline-none focus:border-primary focus:bg-white transition-all">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 text-slate-400 hover:text-textActive text-xs focus:outline-none">
                        <i id="toggleIcon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- REMEMBER ME -->
            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-borderSoft text-primary focus:ring-primary">
                    <span class="text-xs text-textMuted">Ingat Saya</span>
                </label>
            </div>

            <!-- SUBMIT BUTTON -->
            <button type="submit"
                    class="w-full py-2.5 px-4 bg-primary hover:bg-primaryDark text-white font-semibold text-xs sm:text-sm rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center justify-center space-x-2">
                <span>Masuk Sekarang</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- FOOTER / COPYRIGHT -->
        <div class="pt-4 border-t border-borderSoft text-center">
            <p class="text-[11px] text-textMuted">
                &copy; 2026 Sistem Absensi Sekolah. All rights reserved.
            </p>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Toggle Show / Hide Password
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Handle Submit Login Form & Dynamic Redirect
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const role = document.getElementById('user_role').value;

            // Simpan session sementara di LocalStorage
            localStorage.setItem('username', username);
            localStorage.setItem('user_role', role);
            localStorage.setItem('is_logged_in', 'true');

            // Logika Percabangan Redirect berdasarkan Role
            if (role === 'admin') {
                window.location.href = 'index.html';
            } else if (role === 'walas') {
                window.location.href = 'walas/index.html';
            }
        }
    </script>
</body>
</html>
